<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Compute Wars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --ivory:#F2E9D8; --ink:#0b0f14; --panel:#101620; --panel2:#161e2a; --line:#2a3647;
    --gpu:#4E8CFF; --data:#3FD17A; --research:#E8C547; --rogue:#C07AFF; --danger:#FF5A5A;
    --display:'Cinzel', 'Palatino', serif; --body:'EB Garamond', 'Georgia', serif; --mono:'IBM Plex Mono', Menlo, monospace; --label:'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif;
    --own:#7FE6F0; --enemy:#A8FF38; --glow:rgba(127,230,240,.35);
    /* metal da facção (Citadel: latão sobre esmalte azul) */
    --m1:#f3d98f; --m2:#C9A04E; --m3:#7a5c22; --m4:#33230b; --mat:#C9A04E; --mat2:#7a5c22; --enamel:#0f2238; --enamel2:#071320;
    --metal:linear-gradient(180deg,var(--m1) 0%,var(--m2) 35%,var(--m3) 70%,var(--m4) 100%);
    --metalh:linear-gradient(90deg,var(--m4),var(--m2) 20%,var(--m1) 50%,var(--m2) 80%,var(--m4));
    --brass:linear-gradient(180deg,var(--m1),var(--m2) 48%,var(--m3) 100%);
    --btn:linear-gradient(180deg,#2e3c50,#18212c 55%,#0f151d); --chrome:linear-gradient(180deg,#141d2a,#0a1018);
  }
  body[data-f="foundry"], .fac[data-f="foundry"] { --own:#A8FF38; --enemy:#7FE6F0; --glow:rgba(168,255,56,.3); --m1:#ecb98c; --m2:#B8744A; --m3:#6b3a1e; --m4:#2a150a; --mat:#B8744A; --mat2:#5a3520; --enamel:#2a1d17; --enamel2:#160e0a;
    --metal:linear-gradient(180deg,var(--m1) 0%,var(--m2) 35%,var(--m3) 70%,var(--m4) 100%); --metalh:linear-gradient(90deg,var(--m4),var(--m2) 20%,var(--m1) 50%,var(--m2) 80%,var(--m4)); --brass:linear-gradient(180deg,var(--m1),var(--m2) 48%,var(--m3) 100%);
    --btn:linear-gradient(180deg,#43342c,#241b16 55%,#150f0c); --chrome:linear-gradient(180deg,#231a15,#120d0a); }
  /* 4.1.3 Commons: pergaminho e cobre verde-azinhavre sobre esmalte de tinta */
  body[data-f="commons"], .fac[data-f="commons"] { --own:#5FE0B0; --enemy:#7FE6F0; --glow:rgba(95,224,176,.3); --m1:#efe0b8; --m2:#5aa38b; --m3:#2d5f51; --m4:#10261f; --mat:#5aa38b; --mat2:#2d5f51; --enamel:#1c2420; --enamel2:#0d1310;
    --metal:linear-gradient(180deg,var(--m1) 0%,var(--m2) 35%,var(--m3) 70%,var(--m4) 100%); --metalh:linear-gradient(90deg,var(--m4),var(--m2) 20%,var(--m1) 50%,var(--m2) 80%,var(--m4)); --brass:linear-gradient(180deg,var(--m1),var(--m2) 48%,var(--m3) 100%);
    --btn:linear-gradient(180deg,#34433b,#1b2520 55%,#0f1512); --chrome:linear-gradient(180deg,#1a231e,#0c120f); }
  .fac[data-f="citadel"] { --own:#7FE6F0; --glow:rgba(127,230,240,.35); --m1:#f3d98f; --m2:#C9A04E; --m3:#7a5c22; --m4:#33230b; --mat:#C9A04E; --enamel:#0f2238; --enamel2:#071320; --metal:linear-gradient(180deg,var(--m1) 0%,var(--m2) 35%,var(--m3) 70%,var(--m4) 100%); --brass:linear-gradient(180deg,var(--m1),var(--m2) 48%,var(--m3) 100%); }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--ink); color:var(--ivory); font:15px/1.35 var(--body); overflow:hidden; user-select:none; }
  button { font-family:inherit; }
  button:focus-visible, .fac:focus-visible, #mini:focus-visible, input:focus-visible { outline:2px solid var(--own); outline-offset:2px; }
  canvas#c { display:block; }
  /* peças de metal reutilizadas: moldura, placa esmaltada, botão com relevo */
  #info { background:linear-gradient(180deg,var(--enamel2),var(--enamel) 60%,var(--enamel2)); border:1px solid var(--m3); box-shadow:inset 0 1px 0 rgba(255,255,255,.07), inset 0 0 14px rgba(0,0,0,.75), 0 1px 0 rgba(255,255,255,.05); }
  .tb { position:relative; height:30px; padding:0 12px; display:inline-flex; align-items:center; justify-content:center; gap:6px; background:var(--btn); border:1px solid #000; box-shadow:inset 0 1px 0 rgba(255,255,255,.16), inset 0 -2px 0 rgba(0,0,0,.55), 0 0 0 1px var(--m3), 0 2px 3px rgba(0,0,0,.6); color:var(--ivory); font:700 12px var(--label); letter-spacing:1.2px; text-transform:uppercase; text-shadow:0 1px 0 #000; cursor:pointer; transition:filter .12s, box-shadow .12s; }
  .tb:hover { filter:brightness(1.2); box-shadow:inset 0 1px 0 rgba(255,255,255,.2), inset 0 -2px 0 rgba(0,0,0,.55), 0 0 0 1px var(--m1), 0 0 10px var(--glow); }
  .tb:active, .tb[aria-pressed="true"] { background:linear-gradient(180deg,#0b1016,#1a2330); box-shadow:inset 0 2px 5px rgba(0,0,0,.85), 0 0 0 1px var(--m3); transform:translateY(1px); filter:none; }
  .tb svg { width:16px; height:16px; fill:currentColor; }
  /* topo */
  #top { position:fixed; top:0; left:0; right:0; height:44px; background:var(--chrome); border-bottom:3px solid; border-image:var(--metalh) 1; box-shadow:0 3px 14px rgba(0,0,0,.75); display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:12px; padding:0 10px; z-index:3; white-space:nowrap; }
  #top::before { content:''; position:absolute; left:0; right:0; top:0; height:1px; background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent); pointer-events:none; }
  #top .zl { display:flex; align-items:center; gap:6px; min-width:0; }
  #top .emblem { width:36px; height:36px; background:center/contain no-repeat; filter:drop-shadow(0 0 5px var(--glow)); margin-right:2px; }
  .chip { display:flex; align-items:center; gap:5px; height:32px; padding:0 10px 0 3px; background:linear-gradient(180deg,var(--enamel2),var(--enamel)); border:1px solid var(--m3); box-shadow:inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 10px rgba(0,0,0,.7); font:600 16px var(--mono); position:relative; min-width:88px; color:var(--ivory); text-shadow:0 1px 0 #000; }
  .chip img { width:26px; height:26px; flex:none; filter:drop-shadow(0 1px 1px #000); }
  .chip svg { width:16px; height:16px; flex:none; fill:currentColor; margin:0 4px; }
  .chip.gpu svg { color:var(--gpu); } .chip.data svg { color:var(--data); } .chip.research svg { color:var(--research); }
  .chip .tr { width:10px; font:700 13px var(--mono); color:var(--data); } .chip.hide { display:none; }
  .chip.warn { border-color:var(--danger); color:var(--danger); animation:blink 1s infinite; }
  .chip .delta { position:absolute; right:6px; top:-14px; font-size:12px; animation:rise 1.1s ease-out forwards; pointer-events:none; }
  .delta.up { color:var(--data); } .delta.down { color:var(--danger); }
  @keyframes rise { from { opacity:1; transform:translateY(6px); } to { opacity:0; transform:translateY(-12px); } }
  @keyframes blink { 50% { opacity:.55; } }
  /* placa central: latão chanfrado com esmalte por dentro */
  #mid { position:relative; justify-self:center; width:100%; max-width:560px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; min-width:330px; height:40px; padding:0 28px; background:var(--brass); clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%); }
  #mid::before { content:''; position:absolute; inset:3px; background:linear-gradient(180deg,var(--enamel2),var(--enamel)); clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%); box-shadow:inset 0 0 12px #000; }
  #mid > * { position:relative; }
  #clock { font:700 19px/19px var(--display); letter-spacing:2px; color:var(--ivory); text-shadow:0 0 10px var(--glow), 0 1px 0 #000; }
  #era { display:flex; align-items:center; gap:8px; width:100%; }
  #era b { font:600 9px var(--display); letter-spacing:1.6px; color:var(--m1); }
  #era .bar { flex:1; height:4px; background:rgba(0,0,0,.6); border:1px solid var(--m4); } #era .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--m3),var(--m1)); transition:width .4s; }
  #top .right { justify-self:end; display:flex; gap:6px; align-items:center; position:relative; }
  #mutebtn .off, #mutebtn.muted .on { display:none; } #mutebtn.muted .off { display:inline; }
  /* menu suspenso: salvar, carregar, som, volume, sair */
  #menu { position:absolute; top:38px; right:0; width:240px; padding:8px; background:var(--chrome); border:3px solid; border-image:var(--metal) 1; box-shadow:inset 0 0 0 1px #000, 0 12px 30px rgba(0,0,0,.85); display:none; flex-direction:column; gap:6px; z-index:5; }
  #menu.open { display:flex; } #menu .tb { width:100%; justify-content:space-between; height:32px; } #menu .tb kbd { font:500 10px var(--mono); color:#8f9bb0; text-transform:none; letter-spacing:0; }
  #menu .row { display:flex; align-items:center; gap:8px; padding:2px 4px; font:700 11px var(--label); letter-spacing:1px; text-transform:uppercase; color:#aeb7c6; }
  #menu hr { border:0; height:1px; background:linear-gradient(90deg,transparent,var(--m2),transparent); margin:2px 0; }
  input[type=range] { -webkit-appearance:none; appearance:none; flex:1; height:8px; background:linear-gradient(180deg,#000,#1b2430); border:1px solid var(--m3); box-shadow:inset 0 1px 3px #000; cursor:pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:radial-gradient(circle at 35% 30%,var(--m1),var(--m2) 55%,var(--m3)); border:1px solid #000; box-shadow:0 1px 2px #000; }
  input[type=range]::-moz-range-thumb { width:16px; height:16px; border-radius:50%; background:radial-gradient(circle at 35% 30%,var(--m1),var(--m2) 55%,var(--m3)); border:1px solid #000; }
  /* painel: moldura de metal, três zonas (retrato+ficha | command card | minimapa) */
  #bottom { position:fixed; bottom:0; left:0; right:0; max-width:1600px; margin:0 auto; height:200px; background:var(--chrome); border-top:4px solid; border-image:var(--metalh) 1; box-shadow:0 -4px 18px rgba(0,0,0,.75); display:flex; gap:6px; padding:5px 8px 3px; z-index:3; }
  #bottom::before { content:''; position:absolute; left:0; right:0; top:0; height:1px; background:rgba(255,255,255,.14); pointer-events:none; }
  @media (min-width:1801px) { #bottom { border-left:4px solid; border-right:4px solid; border-image:var(--metalh) 1; } }
  #portrait { width:150px; flex:none; border:3px solid; border-image:var(--metal) 1; background:radial-gradient(circle at 50% 35%,var(--enamel),var(--enamel2) 75%) center/contain no-repeat; position:relative; box-shadow:inset 0 0 0 1px #000, inset 0 0 30px rgba(0,0,0,.8), 0 0 0 1px #000; }
  #portrait::after { content:''; position:absolute; inset:2px; pointer-events:none; background-image:radial-gradient(circle at 5px 5px,var(--m1) 0 1.4px,var(--m4) 2px,transparent 2.8px), radial-gradient(circle at calc(100% - 5px) 5px,var(--m1) 0 1.4px,var(--m4) 2px,transparent 2.8px), radial-gradient(circle at 5px calc(100% - 5px),var(--m1) 0 1.4px,var(--m4) 2px,transparent 2.8px), radial-gradient(circle at calc(100% - 5px) calc(100% - 5px),var(--m1) 0 1.4px,var(--m4) 2px,transparent 2.8px); }
  #portrait .name { position:absolute; left:0; right:0; bottom:0; background:linear-gradient(transparent, rgba(0,0,0,.92)); padding:18px 6px 5px; font:600 12px var(--display); letter-spacing:1px; text-align:center; color:var(--m1); text-shadow:0 1px 0 #000; }
  #portrait .lvl { position:absolute; top:6px; left:6px; width:26px; height:26px; border-radius:50%; background:var(--brass); color:#1a1206; font:700 13px var(--mono); display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 1px #000, 0 0 8px var(--glow); }
  #info { width:310px; flex:none; padding:7px 10px; overflow:hidden; display:flex; flex-direction:column; gap:2px; font-size:13px; line-height:1.25; }
  #info h3 { font:700 15px var(--display); letter-spacing:1px; color:var(--m1); line-height:1.2; text-shadow:0 1px 0 #000; }
  #info .sub { font:700 11px var(--label); letter-spacing:1.5px; text-transform:uppercase; color:#9aa6ba; }
  #info .num { font:500 13px var(--mono); }
  .bar { height:7px; background:rgba(0,0,0,.6); border:1px solid #000; position:relative; box-shadow:inset 0 1px 2px #000; } .bar i { display:block; height:100%; transition:width .25s; }
  .bar.hp i { background:linear-gradient(90deg,#2f9a55,#3fd17a); } .bar.hp.low i { background:linear-gradient(90deg,#9a2f2f,#ff5a5a); } .bar.xp i { background:linear-gradient(90deg,var(--m3),var(--m1)); } .bar.q i { background:var(--own); }
  #info .keys { margin-top:auto; font:500 10px var(--mono); color:#9aa6ba; line-height:1.45; } #info .keys b { color:var(--ivory); background:rgba(255,255,255,.08); padding:0 4px; border-radius:2px; font-weight:500; border:1px solid rgba(255,255,255,.1); }
  #cards:empty { display:none; } #cards { width:110px; flex:none; margin:2px 0; display:grid; grid-template-columns:repeat(3, 1fr); grid-auto-rows:44px; gap:3px; align-content:flex-start; }
  #cards button { padding:0; border:1px solid #000; box-shadow:0 0 0 1px var(--m3); background:#07090d center/cover no-repeat; position:relative; cursor:pointer; } #cards button:hover { box-shadow:0 0 0 1px var(--m1); } #cards button i { position:absolute; left:0; right:0; bottom:0; height:3px; background:#3fd17a; } #cards button i.low { background:var(--danger); }
  #actions { flex:1; min-width:376px; margin:0 2px; display:grid; grid-template-columns:repeat(5, minmax(72px, 1fr)); grid-template-rows:repeat(3, 60px); grid-auto-rows:60px; gap:4px; align-content:center; overflow:hidden; }
  #actions:empty { display:none; } #bottom:has(#actions:empty) #info { flex:1; width:auto; } #bottom:has(#cards:not(:empty)) #info { width:260px; } /* com retratos múltiplos, a ficha cede espaço à grade */ /* sem seleção: a ficha ocupa o lugar da grade */
  .slot { background:rgba(0,0,0,.35); border:1px solid #000; box-shadow:inset 0 0 0 1px rgba(255,255,255,.04), inset 0 0 10px #000; opacity:.5; }
  .cmd { position:relative; background:linear-gradient(180deg,#1d2835,#0f161e); border:1px solid #000; box-shadow:inset 0 1px 0 rgba(255,255,255,.1), inset 0 -2px 0 rgba(0,0,0,.5), 0 0 0 1px var(--m3); color:var(--ivory); cursor:pointer; text-align:left; padding:0 4px 0 5px; overflow:hidden; display:grid; grid-template-columns:42px minmax(0,1fr); grid-template-rows:auto auto; column-gap:5px; align-content:center; transition:box-shadow .12s, transform .06s, filter .12s; }
  .cmd:hover:not(:disabled) { box-shadow:inset 0 1px 0 rgba(255,255,255,.14), inset 0 -2px 0 rgba(0,0,0,.5), 0 0 0 1px var(--m1), 0 0 10px var(--glow); filter:brightness(1.12); } .cmd:active:not(:disabled) { transform:translateY(1px); box-shadow:inset 0 2px 5px rgba(0,0,0,.8), 0 0 0 1px var(--m3); filter:none; }
  .cmd:disabled { cursor:default; } .cmd:disabled .thumb { filter:grayscale(.9) brightness(.5); } .cmd:disabled .t { color:#6f7a8c; }
  .cmd .thumb { grid-row:1/3; width:42px; height:42px; display:flex; align-items:center; justify-content:center; } .cmd .thumb img { max-width:100%; max-height:100%; object-fit:contain; filter:drop-shadow(0 1px 1px #000); } .cmd .thumb:not(.glyph) span { display:none; }
  .cmd .thumb.glyph span { width:34px; height:34px; border-radius:50%; background:radial-gradient(circle at 40% 35%,var(--enamel),var(--enamel2)); box-shadow:0 0 0 2px var(--m2), 0 0 0 3px var(--m4), inset 0 0 8px #000; font:700 17px var(--display); color:var(--m1); display:flex; align-items:center; justify-content:center; }
  .cmd .t { font:700 11px/12px var(--label); letter-spacing:.5px; text-transform:uppercase; padding:0; max-height:24px; overflow:hidden; text-shadow:0 1px 0 #000; }
  .cmd .cost { font:500 11px/13px var(--mono); padding:0; color:#b9c2d0; display:flex; flex-wrap:wrap; gap:0 7px; } .cmd .cost span::before { content:''; display:inline-block; width:8px; height:8px; margin-right:3px; border-radius:2px; vertical-align:-0.5px; }
  .cmd .cost .gpu::before { background:var(--gpu); } .cmd .cost .data::before { background:var(--data); } .cmd .cost .research::before { background:var(--research); } .cmd .cost .time::before { display:none; } .cmd .cost .lack { color:var(--danger); }
  .cmd kbd { position:absolute; left:2px; bottom:2px; font:700 10px var(--mono); color:#1a1206; background:var(--brass); padding:0 4px; border:1px solid #000; box-shadow:0 1px 0 rgba(255,255,255,.3) inset; }
  .cmd.hero { box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 0 0 1px var(--m1); } .cmd .cd { position:absolute; inset:0; background:conic-gradient(rgba(0,0,0,.75) var(--p), transparent 0); pointer-events:none; }
  .cmd .prog { position:absolute; left:0; bottom:0; height:3px; background:var(--own); }
  .cmd .q { position:absolute; top:3px; left:4px; font:600 10px var(--mono); background:var(--own); color:#000; padding:0 4px; }
  .cmd.denied { animation:shake .3s; } @keyframes shake { 25% { transform:translateX(-3px); } 75% { transform:translateX(3px); } }
  #miniwrap { width:312px; flex:none; position:relative; display:flex; align-items:center; justify-content:center; }
  #mini { width:300px; height:232px; border:1px solid #000; background:#000; cursor:crosshair; box-shadow:0 0 0 3px var(--m2), 0 0 0 4px var(--m4), inset 0 0 20px rgba(0,0,0,.6); }
  /* mundo */
  #log { position:fixed; top:54px; left:14px; z-index:2; display:flex; flex-direction:column; gap:4px; pointer-events:none; width:340px; }
  #log div { background:linear-gradient(90deg,rgba(8,12,18,.94),rgba(8,12,18,.82)); border:1px solid var(--m3); border-left:3px solid var(--own); padding:4px 10px; font-size:14px; pointer-events:auto; cursor:pointer; animation:slidein .25s ease-out; backdrop-filter:blur(2px); box-shadow:0 2px 8px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.06); }
  #log div.alert { border-left-color:var(--danger); } #log div.hero, #log div.levelup, #log div.era { border-left-color:var(--m1); } #log div:hover { background:rgba(20,28,40,.96); }
  #log button { margin-left:6px; font:700 11px var(--label); letter-spacing:.5px; text-transform:uppercase; background:var(--brass); color:#1a1206; border:1px solid #000; padding:2px 8px; cursor:pointer; box-shadow:inset 0 1px 0 rgba(255,255,255,.4); }
  @keyframes slidein { from { opacity:0; transform:translateX(-12px); } }
  #banner { position:fixed; left:0; right:0; top:34%; text-align:center; pointer-events:none; z-index:4; opacity:0; }
  #banner.intro { top:12%; } #banner.intro p { font-size:20px; }
  #banner.show { animation:banner 3.2s ease-out forwards; }
  #banner h1, .metal-text { font:700 46px var(--display); letter-spacing:8px; background:linear-gradient(180deg,#fff6d2 0%,var(--m1) 28%,var(--m2) 52%,var(--m3) 72%,var(--m1) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 2px 0 #2a1b05) drop-shadow(0 4px 12px rgba(0,0,0,.9)); }
  #banner p { font:italic 500 18px var(--body); color:var(--ivory); text-shadow:0 0 6px #000, 0 1px 0 #000; }
  #banner::before, #banner::after { content:''; display:block; height:2px; width:40%; margin:10px auto; background:linear-gradient(90deg, transparent, var(--m1), transparent); }
  @keyframes banner { 0% { opacity:0; transform:scale(.96); } 12% { opacity:1; transform:scale(1); } 80% { opacity:1; } 100% { opacity:0; } }
  #modeline { position:fixed; top:54px; left:50%; transform:translateX(-50%); z-index:2; background:rgba(8,12,18,.92); border:1px solid var(--m2); box-shadow:0 0 0 1px #000, 0 4px 12px #000; padding:6px 16px; font:700 13px var(--label); letter-spacing:2px; text-transform:uppercase; color:var(--m1); display:none; }
  #tip { position:fixed; z-index:6; background:linear-gradient(180deg,#121a26,#0a1018); border:2px solid; border-image:var(--metal) 1; padding:8px 11px; font-size:14px; max-width:300px; display:none; pointer-events:none; box-shadow:inset 0 0 0 1px #000, 0 8px 24px rgba(0,0,0,.8); }
  #tip b { font:700 13px var(--display); color:var(--m1); letter-spacing:.5px; } #tip small { color:#9aa6ba; display:block; margin-top:3px; }
  #hover { position:fixed; z-index:2; pointer-events:none; display:none; background:rgba(8,12,18,.88); border:1px solid var(--m3); border-left:2px solid var(--mat); padding:3px 8px; font:500 12px var(--mono); }
  #fade { position:fixed; inset:0; background:#000; z-index:8; pointer-events:none; opacity:0; }
  #attackflash { position:fixed; inset:0; pointer-events:none; z-index:1; box-shadow:inset 0 0 120px rgba(255,60,60,0); transition:box-shadow .3s; }
  /* telas */

addEventListener('mousemove', (e) => { if (miniDrag) miniTo(e); if (miniR) { const w = miniWorld(e); miniR.cx = w.x; miniR.cy = w.y; } });
addEventListener('mouseup', () => { miniDrag = false; if (!miniR) return; const ids = selected().filter((u) => u.kind === 'unit' && u.owner === 0).map((u) => u.id), drag = miniR.cx != null && Math.hypot(miniR.cx - miniR.x, miniR.cy - miniR.y) > 40, x = drag ? miniR.cx : miniR.x, y = drag ? miniR.cy : miniR.y; miniR = null;
  if (ids.length) { E.cmd(S, 0, { type: drag ? 'attackmove' : 'move', ids, x, y }); order(drag ? 'attack' : 'move', x, y); (drag ? SFX.attack : SFX.move)(); } });
mini.addEventListener('mousedown', (e) => { e.preventDefault(); const w = miniWorld(e); if (e.button === 2) miniR = { x: w.x, y: w.y }; else if (e.shiftKey) { camWps.push({ x: w.x, y: w.y, t: 0 }); SFX.click(); } else { miniDrag = true; centerOn(w.x, w.y, true); } });
mini.addEventListener('contextmenu', (e) => e.preventDefault());
addEventListener('mouseover', (e) => { const b = e.target.closest && e.target.closest('[data-tip]'); const tip = $('tip'); if (b) { tip.innerHTML = b.dataset.tip; tip.style.display = 'block'; const r = b.getBoundingClientRect(); tip.style.left = Math.min(innerWidth - 310, r.left) + 'px'; tip.style.top = (r.top - 10 - tip.offsetHeight) + 'px'; } else tip.style.display = 'none'; });
function useAbility(h) { if (!h) return; const a = E.HEROES[h.type].ability; if (E.cmd(S, 0, { type: 'ability', id: h.id })) { SFX.ability(h.x, h.y); Voice.say(h, 'ability'); fx.push({ kind: 'ring', x: h.x, y: h.y, r: a.radius * T, t: 0, dur: 0.9, col: ownerCol(0), w: 4 }); fx.push({ kind: 'text', x: h.x, y: h.y - 40, t: 0, dur: 1.2, col: '#E8C547', text: a.name.toUpperCase() }); } else { SFX.deny(); toast(h.abilityCd > 0 ? `${a.name} recarrega em ${Math.ceil(h.abilityCd)} s` : 'Habilidade indisponível', 'alert'); } refreshPanel(); }
// 3.2.8 habilidade 2 (nível 5+) e talentos (modal com dois cartões nos níveis 3/6/9)
function useAbility2(h) { if (!h) return; const a = E.HEROES[h.type].ability2; if (E.cmd(S, 0, { type: 'ability2', id: h.id })) { SFX.ability(h.x, h.y); fx.push({ kind: 'ring', x: h.x, y: h.y, r: 3 * T, t: 0, dur: 0.9, col: '#E8C547', w: 4 }); fx.push({ kind: 'text', x: h.x, y: h.y - 40, t: 0, dur: 1.2, col: '#E8C547', text: a.name.toUpperCase() }); } else { SFX.deny(); toast(E.heroLevel(h) < E.ABILITY2_LVL ? `${a.name} libera no nível ${E.ABILITY2_LVL}` : `${a.name} recarrega em ${Math.ceil(h.ability2Cd)} s`, 'alert'); } refreshPanel(); }
let talentLvl = null;
function talentModal() {
  const pend = E.pendingTalents(S, 0), el = $('talent');
  if (talentLvl && !pend.includes(talentLvl)) { talentLvl = null; el.classList.remove('open'); }
  if (talentLvl || !pend.length) return;
  talentLvl = pend[0]; paused = true; el.querySelector('h2').textContent = `Herói nível ${talentLvl}: escolha um talento`;
  el.querySelector('.cards').innerHTML = E.TALENTS[talentLvl].map((t, i) => `<button class="card" data-k="${t.k}"><b>${t.name}</b>${t.desc}<kbd>${i + 1}</kbd></button>`).join('');
  el.querySelectorAll('.card').forEach((b) => { b.onclick = () => pickTalent(b.dataset.k); }); el.classList.add('open'); el.querySelector('.card').focus(); SFX.levelup();
}
function pickTalent(k) { const t = talentLvl && E.TALENTS[talentLvl].find((x) => x.k === k); if (t && E.cmd(S, 0, { type: 'talent', lvl: talentLvl, k })) { toast(`Talento escolhido: ${t.name}`, 'info'); SFX.confirm(); paused = false; talentLvl = null; $('talent').classList.remove('open'); refreshPanel(); } }
$('talent').addEventListener('keydown', (e) => { const i = parseInt(e.key) - 1; if (talentLvl && E.TALENTS[talentLvl][i]) { e.stopPropagation(); pickTalent(E.TALENTS[talentLvl][i].k); } });
function train(b, ut) { const u = E.UNITS[ut], p = S.players[0]; const cost = u.hero && p.heroXp > 0 ? Object.fromEntries(Object.entries(u.cost).map(([k, v]) => [k, v / 2])) : u.cost; if (E.cmd(S, 0, { type: 'train', bid: b.id, ut })) { SFX.confirm(); } else { SFX.deny(); toast(why(cost, u.tier, u.pop, u.hero && E.heroAlive(S, 0) ? 'Herói já em campo ou na fila' : u.hero && S.t - p.heroDeadAt < 30 ? `Reconvocação em ${Math.ceil(30 - (S.t - p.heroDeadAt))} s` : b.queue.length >= 5 ? MSG.queueFull : null) || 'Não foi possível treinar', 'alert'); } refreshPanel(); }

// ---- painel ----
const costHtml = (c, time) => Object.keys(c || {}).filter((k) => c[k]).map((k) => `<span class="${k}${S.players[0].res[k] < c[k] ? ' lack' : ''}">${Math.round(c[k])}</span>`).join('') + (time ? `<span class="time">${time}s</span>` : '');
// slots vazios completam a grade 5×3 (estilo AoE); sem cartão nenhum, a grade some
function loop(now) {
  if (!S) return;
  const real = Math.min(0.1, (now - last) / 1000); last = now; const dt = paused || intro ? 0 : real * speed;
  const sp = 640 * real / zoom, noSel = !sel.length;
  if (keys.arrowup || (keys.w && noSel)) cam.ty -= sp; if (keys.arrowdown || (keys.s && noSel)) cam.ty += sp; if (keys.arrowleft || (keys.a && noSel)) cam.tx -= sp; if (keys.arrowright || (keys.d && noSel)) cam.tx += sp;
  if (OPT.edge) { if (mouse.x <= 2) cam.tx -= sp; if (mouse.x >= cv.width - 2) cam.tx += sp; if (mouse.y <= 2) cam.ty -= sp; if (mouse.y >= cv.height - 2) cam.ty += sp; }
  if (intro) { intro.t += real; const k = Math.min(1, intro.t / 1.2); zoom = 1 + 0.4 * (1 - Math.pow(1 - k, 3)); const h0 = myHQ(); if (h0) centerOn(h0.x, h0.y); if (intro.t >= 2.5) endIntro(false); }
  if (keys[' '] && !spaceUsed && !pan && performance.now() - spaceT > 250) { spaceUsed = true; const a = E.lastAlertPos(S); if (a) { backPos = { x: cam.tx, y: cam.ty }; centerOn(a.x, a.y); } else toast(MSG.noAlert, 'info'); }
  const xmax = E.MAP_W * T - vw(), ymax = E.MAP_H * T - (cv.width > 1800 ? cv.height : 44 + viewH()) / zoom;
  if (!pan && (panV.x || panV.y)) { [cam.tx, panV.x] = E.glide(cam.tx, panV.x, real, 0, xmax); [cam.ty, panV.y] = E.glide(cam.ty, panV.y, real, -44 / zoom, ymax); cam.x = cam.tx; cam.y = cam.ty; }
  if (camWps.length) { const w = camWps[0]; centerOn(w.x, w.y); if (Math.abs(cam.tx - cam.x) < 2 && Math.abs(cam.ty - cam.y) < 2) { w.t += real; if (w.t > 1) camWps.shift(); } } // 3.5.3: visita os waypoints, 1 s em cada
  cam.tx = xmax < 0 ? xmax / 2 : Math.max(0, Math.min(xmax, cam.tx)); cam.ty = ymax < -44 / zoom ? (ymax - 44 / zoom) / 2 : Math.max(-44 / zoom, Math.min(ymax, cam.ty)); // >1800 px: o mundo aparece ao lado do painel centrado; mapa inteiro (3.5.5): centrado
  if (intro) { cam.x = cam.tx; cam.y = cam.ty; }
  const k = 1 - Math.pow(0.001, real); cam.x += (cam.tx - cam.x) * k; cam.y += (cam.ty - cam.y) * k; if (Math.abs(cam.tx - cam.x) < 0.5) cam.x = cam.tx; if (Math.abs(cam.ty - cam.y) < 0.5) cam.y = cam.ty;
  if (dt > 0) { stepAcc += dt; while (stepAcc >= E.DT) { stepAcc -= E.DT; if (S.spectate) S = E.advance(S, S.t + E.DT); else E.step(S, E.DT); } } // 5.2.1: passo fixo (replay determinístico); espectador segue os comandos gravados
  spawnFx(); for (const f of fx) f.t += real; fx = fx.filter((f) => f.t < f.dur); for (const o of orders) o.t += real; orders = orders.filter((o) => o.t < 0.9);
  draw(); hud(); renderLog(); Sound.tick(S, real);
  if (typeof Techniques !== 'undefined') Techniques.tick(); // 4.3.3 mão de Técnicas (desenha a mira por cima do mundo)
  panelT += real; if (panelT > 0.4) { panelT = 0; sel = sel.filter((id) => E.byId(S, id)); if (!document.querySelector('#actions .cmd:hover')) refreshPanel(); if (!intro && !S.spectate) talentModal(); }
  if (typeof Campaign !== 'undefined') Campaign.tick(S, real);
  if (S.winner !== null) { endScreen(); return; }
  requestAnimationFrame(loop);
}
